<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LumaFlow</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modules/projects/projects.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside id="sidebar" class="sidebar">

        <div class="sidebar-header">

            <div class="logo">

                <i class="fa-solid fa-layer-group"></i>

                <span>LumaFlow</span>

            </div>

        </div>

        <nav class="sidebar-nav">

            <button id="navDashboard"
                    class="nav-item active"
                    onclick="navigate('dashboard')">

                <i class="fa-solid fa-house"></i>

                <span>Dashboard</span>

            </button>

            <button id="navProjects"
                    class="nav-item"
                    onclick="navigate('projects')">

                <i class="fa-solid fa-folder-open"></i>

                <span>Projekte</span>

            </button>

            <button id="navCalendar"
                    class="nav-item"
                    onclick="navigate('calendar')">

                <i class="fa-solid fa-calendar-days"></i>

                <span>Kalender</span>

            </button>

            <hr>

            <button id="navTasks"
                    class="nav-item"
                    onclick="navigate('tasks')">

                <i class="fa-solid fa-list-check"></i>

                <span>Aufgaben</span>

            </button>

            <button id="navMeetings"
                    class="nav-item"
                    onclick="navigate('meetings')">

                <i class="fa-solid fa-users"></i>

                <span>Besprechungen</span>

            </button>

            <button id="navProtocols"
                    class="nav-item"
                    onclick="navigate('protocols')">

                <i class="fa-solid fa-file-lines"></i>

                <span>Protokolle</span>

            </button>

            <button id="navContacts"
                    class="nav-item"
                    onclick="navigate('contacts')">

                <i class="fa-solid fa-address-book"></i>

                <span>Kontakte</span>

            </button>

        </nav>

        <div class="sidebar-footer">

            <button id="navSettings"
                    class="nav-item"
                    onclick="showSettings()">

                <i class="fa-solid fa-gear"></i>

                <span>Einstellungen</span>

            </button>

        </div>

    </aside>

    <!-- =========================
         CONTENT
    ========================== -->

    <main class="content">

        <!-- =====================
             TOPBAR
        ====================== -->

        <header class="topbar">

            <div class="topbar-left">

                <button class="menu-btn"
                        onclick="toggleSidebar()">

                    <i class="fa-solid fa-bars"></i>

                </button>

                <div class="page-title">

                    <h2>LumaFlow</h2>

                    <small>Projektmanagement</small>

                </div>

            </div>

            <div class="topbar-center">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input id="globalSearch"
                           type="text"
                           placeholder="Suche nach Projekten, Aufgaben oder Meetings...">

                </div>

            </div>

            <div class="topbar-right">

                <button class="icon-btn">

                    <i class="fa-regular fa-bell"></i>

                </button>

                <div class="user-box">

                    <div class="avatar">

                        C

                    </div>

                    <div>

                        <strong>Christoph</strong>

                        <small>Administrator</small>

                    </div>

                </div>

            </div>

        </header>

        <!-- =====================
             PAGE
        ====================== -->

        <div id="page"></div>

    </main>

</div>

<script>

function setActiveNavigation(id){

    document
        .querySelectorAll(".nav-item")
        .forEach(button => button.classList.remove("active"));

    const current=document.getElementById(id);

    if(current){

        current.classList.add("active");

    }

}

function navigate(page){

    switch(page){

        case "dashboard":

            setActiveNavigation("navDashboard");

            showDashboard();

            break;

        case "projects":

            setActiveNavigation("navProjects");

            showProjects();

            break;

        case "calendar":

            setActiveNavigation("navCalendar");

            showCalendar();

            break;

        case "tasks":

            setActiveNavigation("navTasks");

            showTasks();

            break;

        case "meetings":

            setActiveNavigation("navMeetings");

            showMeetings();

            break;

        case "protocols":

            setActiveNavigation("navProtocols");

            showProtocols();

            break;

        case "contacts":

            setActiveNavigation("navContacts");

            showContacts();

            break;

    }

}

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList
        .toggle("collapsed");

}

window.onload=function(){

    navigate("dashboard");

};

</script>

<!-- Kalender -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js"></script>

<!-- Module -->

<script src="modules/dashboard.js"></script>
<!-- =========================
     PROJECTS
========================= -->

<!-- Model -->
<script src="modules/projects/models/projectModel.js"></script>

<!-- Services -->
<script src="modules/projects/services/storage.js"></script>
<script src="modules/projects/services/projectService.js"></script>

<!-- Components -->
<script src="modules/projects/components/emptyState.js"></script>
<script src="modules/projects/components/projectHeader.js"></script>
<script src="modules/projects/components/projectStatistics.js"></script>
<script src="modules/projects/components/projectToolbar.js"></script>
<script src="modules/projects/components/projectCard.js"></script>
<script src="modules/projects/components/projectGrid.js"></script>
<script src="modules/projects/components/projectPage.js"></script>

<!-- Workspace -->
<script src="modules/projects/workspace/header.js"></script>
<script src="modules/projects/workspace/navigation.js"></script>
<script src="modules/projects/workspace/overview.js"></script>
<script src="modules/projects/workspace/tasks.js"></script>
<script src="modules/projects/workspace/meetings.js"></script>
<script src="modules/projects/workspace/calendar.js"></script>
<script src="modules/projects/workspace/documents.js"></script>
<script src="modules/projects/workspace/contacts.js"></script>
<script src="modules/projects/workspace/activity.js"></script>
<script src="modules/projects/workspace/settings.js"></script>
<script src="modules/projects/workspace/workspace.js"></script>
<script src="modules/projects/dialogs/projectDialog.js"></script>

<!-- Controller -->
<script src="modules/projects/projects.js"></script>
<script src="modules/tasks.js"></script>

<script src="modules/calendar.js"></script>

<script src="modules/meetings/index.js"></script>
<script src="modules/meetings/parser.js"></script>
<script src="modules/meetings/editor.js"></script>
<script src="modules/meetings/topic.js"></script>
<script src="modules/meetings/note.js"></script>
<script src="modules/meetings/protocol.js"></script>

<script src="modules/protocols.js"></script>

<script src="modules/contacts.js"></script>
<script src="modules/projectContacts.js"></script>

<script src="modules/documents.js"></script>

<script src="modules/settings.js"></script>

<script src="app.js"></script>

</body>
</html>
